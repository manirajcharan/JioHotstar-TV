name: Android YouTube TV CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Clean YouTube TV Project
      run: |
        mkdir -p app/src/main/java/com/example/youtubetv

        echo "include ':app'" > settings.gradle
        echo "rootProject.name = 'YouTubeTV'" >> settings.gradle

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.0.2" }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.youtubetv'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.youtubetv"
                minSdk 21
                targetSdk 33
                versionCode 2
                versionName "1.1"
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:label="YouTube TV" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/youtubetv/MainActivity.java
        package com.example.youtubetv;
        import android.app.Activity;
        import android.os.Bundle;
        import android.view.KeyEvent;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                myWebView = new WebView(this);
                setContentView(myWebView);
                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setMediaPlaybackRequiresUserGesture(false);
                
                // नया और आधुनिक टीवी यूजर एजेंट ताकि खाली डिब्बे न दिखें
                String updatedUserAgent = "Mozilla/5.0 (PlayStation 5;显卡) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36 InettvBrowser/1.0";
                webSettings.setUserAgentString(updatedUserAgent);
                
                myWebView.setWebViewClient(new WebViewClient());
                // यूट्यूब का नया स्पेशल वेब इंटरफेस लिंक
                myWebView.loadUrl("https://www.youtube.com/");
            }
            @Override
            public boolean onKeyDown(int keyCode, KeyEvent event) {
                if ((keyCode == KeyEvent.KEYCODE_BACK) && myWebView.canGoBack()) {
                    myWebView.goBack();
                    return true;
                }
                return super.onKeyDown(keyCode, event);
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.0'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: youtube-tv-app
        path: app/build/outputs/apk/debug/app-debug.apk
