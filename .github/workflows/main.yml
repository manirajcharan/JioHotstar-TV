name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # यह बिना किसी भारी लाइब्रेरी का एकदम लाइटवेट प्रोजेक्ट ढांचा तैयार करेगा
    - name: Create Clean Android Structure
      run: |
        mkdir -p app/src/main/java/com/example/jiohotstartv

        # 1. Root settings.gradle
        echo "include ':app'" > settings.gradle
        echo "rootProject.name = 'JioHotstarTV'" >> settings.gradle

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.0.2" }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. App build.gradle (बिना किसी अप्पकोंपेट डिपेंडेंसी के - एकदम लाइटवेट)
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.jiohotstartv'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.jiohotstartv"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # 4. AndroidManifest.xml (बिना किसी थीम थीम झंझट के सीधे एंड्रॉइड की डिफॉल्ट थीम पर)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <application android:allowBackup="true" android:label="JioHotstar TV" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.java (प्योर एंड्रॉइड एक्टिविटी - सुपर फ़ास्ट)
        cat << 'EOF' > app/src/main/java/com/example/jiohotstartv/MainActivity.java
        package com.example.jiohotstartv;
        import android.app.Activity;
        import android.os.Bundle;
        import android.view.KeyEvent;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                myWebView = new WebView(this);
                setContentView(myWebView);
                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setMediaPlaybackRequiresUserGesture(false);
                myWebView.setFocusable(true);
                myWebView.setFocusableInTouchMode(true);
                String tvUserAgent = "Mozilla/5.0 (Large Screen; SmartTV; Linux; Android 5.1.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.210 Safari/537.36";
                webSettings.setUserAgentString(tvUserAgent);
                myWebView.setWebViewClient(new WebViewClient());
                myWebView.loadUrl("https://www.jiohotstar.com");
            }
            @Override
            public boolean onKeyDown(int keyCode, KeyEvent event) {
                if ((keyCode == KeyEvent.KEYCODE_BACK) && myWebView.canGoBack()) {
                    myWebView.goBack();
                    return true;
                }
                return super.onKeyDown(keyCode, event);
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.0

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jiohotstar-tv-app
        path: app/build/outputs/apk/debug/app-debug.apk
